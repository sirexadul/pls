name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if uploaded as a zip)
        run: |
          if [ ! -f settings.gradle.kts ]; then
            zip_file=$(find . -maxdepth 2 -name '*.zip' | head -n1)
            unzip -q -o "$zip_file" -d project
          fi
          settings=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          echo "PROJECT_DIR=$(dirname "$settings")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: yes-widget-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
